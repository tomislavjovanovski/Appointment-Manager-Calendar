    <script>
      // The production session cookie is Secure, so it is dropped on plain HTTP and every request after login fails.
      (function () {
        var l = window.location;
        var local = /^(localhost|127(\.\d{1,3}){3}|\[::1\]|0\.0\.0\.0|10(\.\d{1,3}){3}|192\.168(\.\d{1,3}){2}|172\.(1[6-9]|2\d|3[0-1])(\.\d{1,3}){2})$/i;
        if (l.protocol === "http:" && !local.test(l.hostname)) l.replace("https://" + l.host + l.pathname + l.search + l.hash);
      })();
    </script>
